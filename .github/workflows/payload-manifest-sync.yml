name: payload-manifest-sync
# #167 — HARD gate: each committed payload artifact (fw4 rules via profile-to-fw4.py; and, for
# tenants on the generic manager, the manifest / net.alloc / guardian-init via profile-to-manifest.py)
# must equal what the emitters regenerate from deploy/<app>/profile.yaml, AND no two installed tenants
# may collide on a host port / subnet / fw4 zone / bridge. A stale artifact = hidden drift; a
# collision = a second tenant silently clobbering the first's DNAT. (Also closes the fw4-ungated gap.)
on:
  pull_request:
    paths:
      - 'deploy/**/profile.yaml'
      - 'deploy/**/*.manifest'
      - 'deploy/**/*.net.alloc'
      - 'deploy/**/*.fw4.uci'
      - 'deploy/**/batman-payload-*.init'
      - 'scripts/profile-to-manifest.py'
      - 'scripts/profile-to-fw4.py'
      - 'scripts/check-payload-manifest.sh'
      - 'feed/batman-provision/files/usr/bin/payload-arbiter'
      - 'deploy/**/*.hardening.env'
      - 'deploy/**/*.conf'
      - 'deploy/**/verify-profile-*.sh'
      - 'deploy/**/reconcile-resources.sh'
      - 'feed/batman-payload-host/Makefile'
      - 'deploy/payload-host-packages.txt'
      - 'scripts/check-payload-host-sync.sh'
      # #274: payload-run / stop / guardian behaviour is gated by scripts/test-payload-run.sh (run by the check)
      - 'feed/batman-provision/files/usr/bin/payload-run'
      - 'feed/batman-provision/files/usr/lib/batman/payload-stop.sh'
      - 'feed/batman-provision/files/usr/lib/batman/payload-guardian.sh'
      - 'scripts/test-payload-run.sh'
  push:
    branches: [main]
    paths:
      - 'deploy/**/profile.yaml'
      - 'deploy/**/*.manifest'
      - 'deploy/**/*.net.alloc'
      - 'deploy/**/*.fw4.uci'
      - 'scripts/profile-to-manifest.py'
      - 'scripts/profile-to-fw4.py'
      - 'feed/batman-provision/files/usr/bin/payload-run'
      - 'feed/batman-provision/files/usr/lib/batman/payload-stop.sh'
      - 'scripts/test-payload-run.sh'
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet pyyaml
      - name: payload artifacts must match profile SoT + no tenant collisions (+ test-payload-run, GNU tools)
        run: PYTHON=python3 sh scripts/check-payload-manifest.sh
      # #274: the same offline test with busybox applets first on PATH (the node runs busybox, not GNU;
      # a GNU-only construct shipped once in an rc). See the BUSYBOX=1 note in the script.
      - name: payload-run / payload-stop under busybox
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq busybox
          BUSYBOX=1 sh scripts/test-payload-run.sh
      # #159 review M2 drift guard (meta-package DEPENDS == captured runtime closure). It existed but
      # was never wired in, and had silently gone red on main (#209 S4-4).
      - name: batman-payload-host DEPENDS must match deploy/payload-host-packages.txt
        run: sh scripts/check-payload-host-sync.sh
