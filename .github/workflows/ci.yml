name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    # TEMPORARY (review round 1 evidence, reverted before the report): the job on both images
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  #test-dv-ble-254's negative controls read fixed commits (git show fbb14e4~1 / 2ecf1cb)
      - name: shellcheck (errors block; warnings informational)
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error
      - name: validation harness reachability logic (#265) — q/UNDETERMINED, settle, revert/held waits, fleet settle (stub ssh)
        run: bash scripts/test-harness-265.sh
      - name: nothing root runs on a node trusts world-writable /tmp (#280) — allowlist check + mutation proof
        run: bash scripts/check-tmp-trust.sh && bash scripts/test-tmp-trust.sh
      - name: dv-preflight negative controls (#254 PR-H1 N9) — every misconfiguration FAILs for its own reason (stub ssh)
        run: bash scripts/test-dv-preflight.sh
      - name: BLE judges offline (#254 PR-H1 N10) — settings tokens, btmon judge, pairing verdicts, RPA judge
        run: bash scripts/test-dv-ble-254.sh
      - name: N3 held-trial script vs a simulated node (#254 PR-H1) — only guarded rollbacks, flag kept after the OTA
        run: bash scripts/test-negctl-old-slot-254.sh
      - name: "#305 mini UART judges offline — gate / serial counters / sysfs sequence / kmsg window / settings / flip verdicts (good + bad cases)"
        run: bash scripts/test-dv-bt-uart-305.sh
      - name: busybox for lint-wbox (sh -n in the node's ash)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq busybox
      - name: "#254 S5 on-node judges offline — slot-lock helper (busybox ash + dash), release-key / fw-boot / UD-L judges, node fw-boot script on fixtures, ab-selftest SLOTLK-BUSY verdicts"
        if: ${{ !cancelled() }}
        run: |
          rc=0
          bash scripts/test-slotlock-254.sh || rc=1
          bash scripts/test-s5-dv-254.sh || rc=1
          bash scripts/test-s5-node-254.sh || rc=1
          bash scripts/test-ab-selftest-254.sh || rc=1
          exit $rc
      - name: "#254 preflight P9 node judge on fixtures ([all] / wbox slots / prov leftovers) under busybox ash"
        run: bash tests/prov-p1/p9-judge.sh scripts/node/prov-p9-254.sh
      - name: "#254 rollback arm / launcher / rbfix offline — every §22.1 precondition, FAIL-RECOVERED (+ openmanetd), FAIL-NEEDS-PERSON, rbfix preconditions, pty drop + plain-& negative control"
        run: bash tests/prov-p1/rbarm.sh
      - name: "#254 prov-misc dry-run arm offline — atomic pid + presence, judge (order / hold / cap / lingering member), node-side INLOOP, session scan under /proc churn"
        run: bash tests/prov-p1/misc-dry.sh
      - name: "#254 -wbox variants well formed (scope, protected set, witness, sh -n, nohold, helpers.list) — lint-wbox + its negative self-test"
        run: bash scripts/lint-wbox.sh && bash tests/wbox/test-lint-wbox.sh
      - name: "#254 lint-install — every feed/batman-provision file has exactly one Makefile install line (+ its negative self-test)"
        run: bash scripts/lint-install.sh . && bash tests/prov-p1/test-lint-install.sh .
      - name: "#254 known-failures expiry — 4-column list, expired entries are NEW, malformed lines FAIL (11 cases)"
        run: bash tests/known-failures.sh
      - name: "#254 NEEDS-PERSON blocks every later D suite on DNODE (dnode_blocked + its call in suite())"
        run: bash tests/dnode-block.sh
      - name: "#254 prov-254 host helpers offline — pr_wait_held bounded by the host clock, the host lock owner / stale message"
        run: bash tests/prov-p1/lib-host.sh
      - name: line-endings must be LF
        run: |
          if grep -rlIP '\r$' --include='*.sh' --include='*.py' .; then
            echo "::error::CRLF found in a script (breaks shebangs on the nodes)"; exit 1
          fi

  vectors-219:
    # #254 PR-H1 §4.2: the provisioning-protocol vectors are re-verified by an independent implementation on
    # every push; the gate fails on a silently removed check, on vectors.json drifting from gen.py, and its own
    # negative control (a tampered psk_replay must be REJECTED by verify.py, not crash it).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405   # v6.2.0
        with:
          python-version: '3.12'
      - name: install the hash-pinned closure (no resolver, no unpinned transitive deps)
        run: python -m pip install --require-hashes --no-deps -r tests/vectors/219-protocol/requirements.txt
      - name: verify.py >= MIN_CHECKS, gen.py reproduces vectors.json, tampered vector rejected
        run: PY=python MIN_CHECKS=195 bash tests/vectors/219-protocol/ci-check.sh
      - name: squashfs-tools for signrel's image check (a real squashfs with and without T, #254 S5)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools
      - name: "#254 H4 host tools selftests (254-h4 §1.2) — peer (vectors + fake bridge), netobj, nodecert, blebridge, httprelay, benchstore, signrel (the test release signer)"
        run: |
          cd tests/tools/peer
          python peer.py --selftest
          python netobj.py --selftest
          python nodecert.py --selftest
          python blebridge.py --selftest
          python httprelay.py --selftest
          python benchstore.py --selftest
          python signrel.py --selftest
      - name: "#254 H4 offline judges (254-h4 §16) — cap / hs / secrets, each with its bad-log cases"
        run: python tests/judges/h4/test-judges.py

  prov-p1:
    # TEMPORARY (review round 1 evidence, reverted before the report): the job on both images
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: busybox for the ash runs, squashfs-tools for card-wbox
        run: sudo apt-get update -qq && sudo apt-get install -y -qq busybox squashfs-tools
      - name: "#254 P1 stub tests (no root): decider / init hook, autocommit prov case, 99zz mesh_expect, batman-slot release"
        run: |
          F=feed/batman-provision/files
          # harness lands first (#290): on a checkout whose product is pre-P1 this job is RED on purpose (P-U9: red, KNOWN #254)
          [ -f $F/usr/libexec/batman-addr-defer ] || { echo "::error::product in this checkout is pre-P1 (no $F/usr/libexec/batman-addr-defer): expected red until feat/254-p1 lands (#254)"; exit 1; }
          bash tests/prov-p1/addr-defer.sh $F/usr/libexec/batman-addr-defer
          sed '1s#.*#\#!/usr/bin/busybox sh#' $F/usr/libexec/batman-addr-defer > /tmp/dec.bb && chmod +x /tmp/dec.bb && bash tests/prov-p1/addr-defer.sh /tmp/dec.bb
          bash tests/prov-p1/autocommit-prov-case.sh $F/usr/bin/batman-autocommit
          bash tests/prov-p1/autocommit-mesh-arm.sh $F/usr/bin/batman-autocommit
          bash tests/prov-p1/99zz-mesh-expect.sh $F/etc/uci-defaults/99zz-batman-prov-state
          bash tests/prov-p1/batman-slot-addr-defer.sh $F/usr/sbin/batman-slot
          # P1b's product gate (#254 security review F1) lands after the harness (#290): red on purpose until then
          grep -q '^wbox_gate_self() {' $F/usr/sbin/batman-slot || { echo "::error::product in this checkout is pre-P1b (no wbox_gate_self in batman-slot): expected red until feat/254-p1b-seams lands (#254)"; exit 1; }
          bash tests/prov-p1/wbox-gate.sh $F/usr/sbin/batman-slot $F/usr/bin/batman-autocommit
          bash tests/prov-p1/card-wbox.sh .
      - name: "#254 P1 loop-device tests (root): config-save identity freeze / frozen no-remount / prov-get rc 10, prov-base compare rules"
        run: |
          F=feed/batman-provision/files
          sudo PROV_SRC=$PWD/$F bash tests/prov-p1/cfgsave-identity-freeze.sh $F/usr/bin/batman-config-save
          sudo PROV_SRC=$PWD/$F bash tests/prov-p1/cfgsave-frozen-nomount.sh $F/usr/bin/batman-config-save
          sudo PROV_SRC=$PWD/$F bash tests/prov-p1/cfgsave-provget-rc10.sh $F/usr/bin/batman-config-save
          sudo bash tests/prov-p1/prov-base-statecmp.sh scripts/node/prov-base-254.sh
          sudo bash tests/prov-p1/prov-base-stateset.sh scripts/node/prov-base-254.sh
          bash tests/prov-p1/prov-base-names.sh scripts/node/prov-base-254.sh
      - name: "#254 P1 Go unit tests (batman-prov helper)"
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: cd feed/batman-prov/src && GOFLAGS=-mod=vendor GOTOOLCHAIN=local go vet ./... && GOFLAGS=-mod=vendor GOTOOLCHAIN=local go test ./...
      # the prov_test seams (killpoints, version marker) and the root-only sock tests (SO_PEERCRED, socket-dir chown):
      # without the tag and root they never ran in CI (they t.Skip). Any SKIP here is a FAIL (254-h23 §23.9 gap review).
      - name: "#254 P1 Go unit tests as root with -tags prov_test (seams, sock)"
        run: |
          cd feed/batman-prov/src
          o=$(sudo env PATH="$PATH" HOME="$HOME" GOCACHE=/tmp/gocache-root GOFLAGS=-mod=vendor GOTOOLCHAIN=local go test -count=1 -v -tags prov_test ./... 2>&1) && rc=0 || rc=$?   # bash -e: a bare `o=$(...); rc=$?` exits before printing
          echo "$o" | grep -E '^(--- (FAIL|SKIP)|ok|FAIL|panic)'
          [ $rc = 0 ] || { echo "go test rc=$rc; the failing tests' own lines:"; echo "$o" | awk '/^=== RUN/ { b = "" } { b = b $0 ORS } /^--- FAIL/ { printf "%s", b }'; exit 1; }
          ! echo "$o" | grep -q -- '--- SKIP' || { echo '::error::a Go test skipped under root + prov_test'; exit 1; }
      - name: "#254 claim-lock fix stub tests (no root): prov_apply_lock, prov_root_hash_ok, S13 batman-prov-lock, rollback lock gate, cross-file lints"
        run: |
          F=feed/batman-provision/files
          # harness lands first (#290): on a checkout whose product is 1.5.13 (no boot-time lock) this step is RED on purpose (KNOWN #254)
          # — the LAST step of the job, so the expected red never skips the P1 steps above
          [ -f $F/etc/init.d/batman-prov-lock ] || { echo "::error::product in this checkout predates the #254 claim-lock fix (no $F/etc/init.d/batman-prov-lock): expected red until fix/254-claim-lock lands"; exit 1; }
          bash tests/prov-p1/prov-apply-lock.sh $F/usr/lib/batman/prov-lock.sh
          bash tests/prov-p1/prov-root-hash.sh $F/usr/lib/batman/prov-lock.sh
          bash tests/prov-p1/prov-lock-init.sh $F/etc/init.d/batman-prov-lock $F/usr/lib/batman/prov-lock.sh
          bash tests/prov-p1/batman-slot-rollback-gate.sh $F/usr/sbin/batman-slot $F/usr/lib/batman/prov-lock.sh
          bash tests/prov-p1/claim-lock-lints.sh .
      # #254 wireless transactions (254-wireless-txn §6/§7/§11, v8 §15; review A m9). The harness lands first (#290): on a
      # product without them these two steps are RED on purpose (KNOWN #254); `!cancelled()` so they run (and the steps
      # above are never skipped by them) whatever happened before.
      - name: "#254 wireless-txn shell tests (no root): setkey --forget-mesh + writer lock, --check-only + .txn refusal + hand-disabled forget, chanfix lock, halow-status NETCHANGE, batman-slot refuses an OTA while .txn"
        if: ${{ !cancelled() }}
        run: |
          F=feed/batman-provision/files
          grep -q -- '--forget-mesh' $F/usr/bin/halow-setkey || { echo "::error::product in this checkout predates the wireless transactions (no halow-setkey --forget-mesh): expected red until feat/254-p1b-seams lands (#254)"; exit 1; }
          bash tests/prov-p1/setkey-forget-lock.sh $F/usr/bin/halow-setkey $F/usr/lib/batman/rundir.sh
          bash tests/prov-p1/chanfix-lock.sh $F/etc/uci-defaults/99-batman-chanfix $F/usr/lib/batman/rundir.sh
          bash tests/prov-p1/halow-status-txn.sh $F/usr/bin/halow-status
          grep -q -- '--check-only' $F/usr/bin/halow-setkey || { echo "::error::product in this checkout predates wireless-txn v8 (no halow-setkey --check-only): expected red until feat/254-p1b-seams lands (#254)"; exit 1; }
          bash tests/prov-p1/setkey-checkonly-txn.sh $F/usr/bin/halow-setkey $F/usr/lib/batman/rundir.sh
          grep -q 'unfinished network change' $F/usr/sbin/batman-slot || { echo "::error::batman-slot in this checkout predates wireless-txn v8 §15.3: expected red until feat/254-p1b-seams lands (#254)"; exit 1; }
          bash tests/prov-p1/slot-p5gate-txn.sh $F/usr/sbin/batman-slot
      - name: "#254 wireless-txn loop-device test (root): config-save --save --txn, the txn sequence re-check / none-none rule, --check rc 5 while .txn"
        if: ${{ !cancelled() }}
        run: |
          F=feed/batman-provision/files
          grep -q -- '--save \[--promote-lkg\] \[--txn' $F/usr/bin/batman-config-save || { echo "::error::batman-config-save in this checkout has no --save --txn: expected red until feat/254-p1b-seams lands (#254)"; exit 1; }
          sudo PROV_SRC=$PWD/$F bash tests/prov-p1/cfgsave-txn-save.sh $F/usr/bin/batman-config-save
      # #254 S5 (254-p3-impl §3.7–3.8) lands harness-first (#290): on a product before S5 this step is RED on purpose
      # (KNOWN #254). `!cancelled()` so an earlier red step never hides its result, and each sub-test runs whatever the
      # one before it did (rc is accumulated) so every failure shows, not only the first.
      - name: "#254 S5 software update, offline (harness lands first, #290: red until feat/254-p3 S5 lands, KNOWN #254) — slot flock + names, lock allowlists + ramfs flock, commit releases the lock (busybox sh + dash), payload format, provd tmpfs init, autocommit health, the HTTP firewall include"
        if: ${{ !cancelled() }}
        run: |
          F=feed/batman-provision/files
          rc=0
          bash tests/prov-p1/s5-slot-lock.sh $F || rc=1
          bash tests/prov-p1/s5-lock-lint.sh $F || rc=1
          bash tests/prov-p1/s5-lock-release.sh $F/usr/sbin/batman-slot || rc=1
          bash tests/prov-p1/s5-payload.sh scripts/build-ab-payload.sh || rc=1
          sudo bash tests/prov-p1/s5-bulk-mount.sh feed/batman-prov/files/batman-provd.init || rc=1
          sudo bash tests/prov-p1/s5-bulk-mount.sh feed/batman-prov/files/batman-provd-test.init || rc=1
          sudo bash tests/prov-p1/s5-autocommit.sh $F/usr/bin/batman-autocommit || rc=1
          command -v nft >/dev/null || sudo apt-get install -y -qq nftables
          # the runner's kernel must check the bridge table too: the WSL-only escape hatch is never set here
          [ -z "${S5_NFT_INET_ONLY:-}" ] || { echo "::error::S5_NFT_INET_ONLY is set in CI: the bridge table would go unchecked"; rc=1; }
          sudo bash tests/prov-p1/s5-nft.sh feed/batman-prov/files/batman-http.nft || rc=1
          exit $rc
      # #254 P3 settings / status shell tests (moved from feat/254-p3 to the harness, #290). Red on purpose on a product
      # before P3 (each test says "predates P3 … expected red until feat/254-p3 lands"); `!cancelled()`, rc accumulated.
      - name: "#254 P3 settings + status offline (harness lands first, #290: red until feat/254-p3 lands, KNOWN #254) — halow-setkey --country / --ap, joinwatch verdict_code, config-save keeps the AP ssid (loop device), the network/update shape text the harness keys on"
        if: ${{ !cancelled() }}
        run: |
          F=feed/batman-provision/files
          rc=0
          bash tests/prov-p3/setkey-settings.sh $F/usr/bin/halow-setkey $F/usr/lib/batman/rundir.sh || rc=1
          bash tests/prov-p3/joinwatch-code.sh $F/usr/bin/joinwatch || rc=1
          sudo PROV_SRC=$PWD/$F bash tests/prov-p3/cfgsave-ssid.sh $F/usr/bin/batman-config-save || rc=1
          # scripts/dv/prov-254.sh pr_cddl_nu keys on the helper's "update shape" text: a product rename fails here, not silently
          # as three network/update units INVALID on every image (harness review r2 A m5 / B m8)
          bash tests/prov-p1/p3-update-shape-string.sh . || rc=1
          exit $rc
      # #320 lands harness-first (#290): on a product that still has `cmd < file 2>/dev/null` reads this step is RED on
      # purpose (KNOWN #320). Its own LAST step with !cancelled(), so the expected red never skips the steps above.
      - name: "#320 redirect-read stderr quiet — lint feed/*/files (zero exceptions), #202 A3 block under busybox ash, mutant negative control"
        if: ${{ !cancelled() }}
        run: |
          bash tests/prov-p1/cfgsave-stderr-quiet.sh . || { echo "::error::unguarded redirect-reads in feed/ (busybox prints can't open before 2> applies): expected red until fix/320-cfgsave-stderr lands (#320)"; exit 1; }

  ab-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdisk dosfstools squashfs-tools parted rsync
      - name: A/B card invariants (#133) — builds a real card on a loop device
        run: ./tests/ab-card-invariants.sh
      - name: A/B card invariants, Pi 3 / bcm2710 (#209) — p7 firmware partition + hybrid MBR
        run: SOC=bcm2710 ./tests/ab-card-invariants.sh
      - name: "#254 claim-lock fix v9.1 §5.6 + prov-unit-gate — stage-root stdout is exactly the target device; .seeded x meta x state matrix (real card, 23 cases)"
        run: |
          F=feed/batman-provision/files
          # harness lands first (#290): on a product without the fix the L44 branch FAILs — red on purpose (KNOWN #254)
          sudo bash tests/prov-p1/batman-slot-stage-root.sh $F/usr/sbin/batman-slot $F/usr/lib/batman/prov-lock.sh
      - name: "#254 prov-unit-gate negative controls — the allow-claimed mutant and the 1.5.12-wsl.9 batman-slot each FAIL in exactly their cases"
        run: |
          F=feed/batman-provision/files
          sudo bash tests/prov-p1/gate-negatives.sh $F/usr/sbin/batman-slot $F/usr/lib/batman/prov-lock.sh

  dv-sbx:
    # 254-h23 §4.4 / p1-impl §4.10, §5.1: the provisioning sandbox — root on a native arm64 runner (unshare + capsh +
    # chroot into the pinned base rootfs with this checkout's product laid over it). Its own escape negatives first, then
    # prov-unit-96 and the four mutants that must FAIL. On a pre-P1b product (no prov_test seams) it is red with that
    # message (stricter than §4.4's continue-on-error: nothing is hidden).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools libcap2-bin e2fsprogs
      - name: "dv-sbx: escape negatives, prov-unit-96 (104 cases) + 4 mutants, prov-unit-cfgsave (36 cases) + 3 mutants"
        run: sudo env PATH="$PATH" HOME="$HOME" GITHUB_ACTIONS="$GITHUB_ACTIONS" GOCACHE=/tmp/gocache-root bash scripts/dv-sbx.sh --go "$(command -v go)" escape 96 96:meta-bad-unlock 96:p6-unlock 96:devopen-exempt 96:skip-decision cfgsave cfgsave:meta-first cfgsave:onjoin-prov cfgsave:check-late armmesh armmesh:no-joined helper helper:rc9-gen helper:rc10-gen helper:gen-first
      - name: "dv-sbx prov-unit-bcm2710 (SMOKE): escape, 96, cfgsave on the bcm2710 payload rootfs"
        run: sudo env PATH="$PATH" HOME="$HOME" GITHUB_ACTIONS="$GITHUB_ACTIONS" GOCACHE=/tmp/gocache-root bash scripts/dv-sbx.sh --soc bcm2710 --go "$(command -v go)" escape 96 cfgsave helper

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install grype (parses requirements.txt; OSV+NVD+GHSA)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/bin"
      - name: Grype CVE scan (gate on critical; backlog VEX-suppressed in .grype.yaml)
        run: |
          set -o pipefail
          "$RUNNER_TEMP/bin/grype" dir:. --by-cve -o table | tee grype.txt
      - name: Upload grype report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-cve-report
          path: grype.txt
      - name: SBOM (CycloneDX, Syft) — published as an artifact
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          artifact-name: batman-sbom.cdx.json

  # TEMPORARY (review round 1 evidence, reverted before the report): on ubuntu-latest (26.04) the slotlock test 3x,
  # its still-check negative control, and the D-state precondition negative control with 26.04's uutils dd
  tmp-2604-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq busybox
      - name: image and tools
        run: |
          grep PRETTY /etc/os-release
          dd --version | head -1; readlink -f "$(command -v dd)"
          command -v gnudd && gnudd --version | head -1
      - name: slotlock 3 times
        run: |
          rc=0
          for i in 1 2 3; do s=$(date +%s); bash scripts/test-slotlock-254.sh > /tmp/sl.$i 2>&1 || rc=1; echo "run $i: $(tail -1 /tmp/sl.$i) ($(( $(date +%s) - s )) s)"; grep '^FAIL' /tmp/sl.$i || true; done
          grep -h 'step window' /tmp/sl.1
          exit $rc
      - name: slotlock negative control — SLK_TEST_HOLD=1 (holders gone before their cases end) must FAIL the still-checks
        run: |
          SLK_TEST_HOLD=1 bash scripts/test-slotlock-254.sh > /tmp/slneg 2>&1 && rc=0 || rc=$?
          grep -E 'the case judged nothing|^SLOTLOCK' /tmp/slneg; echo "rc=$rc"
          [ "$rc" != 0 ] || exit 1
          [ "$(grep -c 'the case judged nothing' /tmp/slneg)" -ge 10 ] || exit 1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: D-state test with gnudd (the default here) and the precondition negative control with uutils dd
        run: |
          cd feed/batman-prov/src
          g(){ sudo env PATH="$PATH" HOME="$HOME" GOCACHE=/tmp/gocache-root GOFLAGS=-mod=vendor GOTOOLCHAIN=local "$@" go test -count=1 -v -tags prov_test -run TestExecAbandonsDState ./provstore/ 2>&1; }
          o=$(g) && rc=0 || rc=$?; echo "$o" | grep -E '^(=== RUN|--- |ok|FAIL)|exec_dstate'; echo "default rc=$rc"
          [ "$rc" = 0 ] || exit 1
          o=$(g PROVTEST_DD=dd) && rc=0 || rc=$?; echo "$o" | grep -E '^(=== RUN|--- |ok|FAIL)|exec_dstate'; echo "PROVTEST_DD=dd rc=$rc"
          [ "$rc" != 0 ] || exit 1
          grep -q 'precondition: dd never blocked in D state' <<< "$o" || exit 1
