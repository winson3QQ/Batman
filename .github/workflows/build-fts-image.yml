name: build-fts-image
# Build the FreeTAKServer container image OFF-node (#85). The field node's ~3.9 GB overlay
# can't hold a non-trivial on-device build — an `apt upgrade` layer once filled it and forced
# docker's btrfs loop read-only mid-build (see docs/fts-cve-triage.md). So build arm64 here
# (QEMU/buildx), scan the real image (catches base-OS CVEs the requirements.txt gate can't),
# and publish a `docker load`-able tarball the operator pulls to the node while "借網".
on:
  workflow_dispatch:
  push:
    paths:
      - 'deploy/fts/**'
      - '.github/workflows/build-fts-image.yml'
permissions:
  contents: read
  id-token: write   # cosign keyless (Sigstore OIDC) — #73/#13 signing, no key to custody
jobs:
  build-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation for the Pi target)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build fts:2.2.1 for linux/arm64 -> loadable tar
        uses: docker/build-push-action@v6
        with:
          context: deploy/fts
          platforms: linux/arm64
          tags: fts:2.2.1
          # type=docker emits a `docker load`-able archive (single platform).
          outputs: type=docker,dest=${{ runner.temp }}/fts-arm64.tar
          provenance: false

      - name: Load the built image into the runner's docker
        run: docker load -i "${{ runner.temp }}/fts-arm64.tar"

      # Runtime + functional gate (#45): a build/import pass does NOT prove FTS still works
      # after a dependency bump (cryptography/TLS run only at runtime). Run the image under
      # QEMU and exercise the changed paths with independent oracles (openssl-verified cert
      # gen, stdlib-ssl mTLS handshake + a no-cert negative control, CoT round-trip). Hard
      # gate — a broken crypto bump fails HERE, not on the field node.
      - name: Functional test (forced paths, independent oracles)
        run: |
          chmod +x deploy/fts/functional-test.sh
          deploy/fts/functional-test.sh fts:2.2.1

      - name: Compress image tarball
        run: |
          gzip -c "${{ runner.temp }}/fts-arm64.tar" > "${{ runner.temp }}/fts-2.2.1-arm64.tar.gz"
          ls -lh "${{ runner.temp }}/fts-2.2.1-arm64.tar.gz"

      # Sign the image artifact — keyless (Sigstore/Fulcio via GitHub OIDC), so there is NO
      # signing key to custody or rotate; the signer identity is this workflow's OIDC token,
      # and the signature + cert are logged to the Rekor transparency log (#73 gate 9 / #13).
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign image tarball (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          IMG="${{ runner.temp }}/fts-2.2.1-arm64.tar.gz"
          sha256sum "$IMG" | awk '{print $1}' > "$IMG.sha256"
          cosign sign-blob --yes \
            --output-signature "$IMG.sig" \
            --output-certificate "$IMG.pem" \
            "$IMG"
          echo "## Image signature (cosign keyless)" >> "$GITHUB_STEP_SUMMARY"
          echo "Signed \`$(basename "$IMG")\` sha256 \`$(cat "$IMG.sha256")\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Verify: \`cosign verify-blob --signature fts-2.2.1-arm64.tar.gz.sig --certificate fts-2.2.1-arm64.tar.gz.pem --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.*' --certificate-oidc-issuer https://token.actions.githubusercontent.com fts-2.2.1-arm64.tar.gz\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish loadable image + signature (docker load on the node)
        uses: actions/upload-artifact@v4
        with:
          name: fts-2.2.1-arm64-image
          path: |
            ${{ runner.temp }}/fts-2.2.1-arm64.tar.gz
            ${{ runner.temp }}/fts-2.2.1-arm64.tar.gz.sig
            ${{ runner.temp }}/fts-2.2.1-arm64.tar.gz.pem
            ${{ runner.temp }}/fts-2.2.1-arm64.tar.gz.sha256

      - name: Install grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/bin"

      # Authoritative image scan — sees base-OS packages too. BLOCKING on Critical since #83
      # landed (bookworm -> trixie + dropping the lxml-bundled system libxml2/libxslt drove the
      # base Criticals 15 -> 0). `--fail-on critical` fails the build on any NEW Critical; Highs
      # (the frozen FTS python deps #45-P2, won't-fix base Highs) are tracked, not gated. The
      # python-dep gate stays in ci.yml (requirements.txt). To defer a specific new Critical,
      # add it to .grype.yaml `ignore` with a justification — never blanket-disable this gate.
      - name: Grype scan of the built image (blocking on Critical; #83)
        run: |
          set -o pipefail
          rc=0
          "$RUNNER_TEMP/bin/grype" "docker-archive:${{ runner.temp }}/fts-arm64.tar" \
            --by-cve --fail-on critical -o table | tee image-grype.txt || rc=$?
          {
            echo "## FTS image CVE scan (grype)"
            echo '```'
            { grep -E 'Critical|High' image-grype.txt || echo 'no Critical/High'; } | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc   # fails the build only on a Critical (--fail-on), after writing the summary

      - name: Upload image grype report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fts-image-grype-report
          path: image-grype.txt

      - name: Image SBOM (CycloneDX, Syft)
        uses: anchore/sbom-action@v0
        with:
          image: docker-archive:${{ runner.temp }}/fts-arm64.tar
          format: cyclonedx-json
          artifact-name: fts-image-sbom.cdx.json
