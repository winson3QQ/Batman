<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 940" width="1720" height="940" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="1720" height="940" fill="#ffffff"/>

  <text x="30" y="38" font-size="23" font-weight="700" fill="#111">4S 電源接線圖 — 電池盒 / 通訊本體</text>
  <text x="30" y="60" font-size="13" fill="#666">HaLow MANET 移動節點．保護元件全在電池盒側，開關走 EN，INA226 量電池側電流兼低電量偵測</text>

  <g font-size="12.5" fill="#333">
    <line x1="1200" y1="30" x2="1240" y2="30" stroke="#d93025" stroke-width="3.5"/><text x="1248" y="34">正極 (+)</text>
    <line x1="1330" y1="30" x2="1370" y2="30" stroke="#333" stroke-width="3.5"/><text x="1378" y="34">共負 (−)</text>
    <line x1="1455" y1="30" x2="1495" y2="30" stroke="#1a73e8" stroke-width="2"/><text x="1503" y="34">均衡感測</text>
    <line x1="1590" y1="30" x2="1630" y2="30" stroke="#00897b" stroke-width="2.5"/><text x="1638" y="34">I2C</text>
    <line x1="1200" y1="56" x2="1240" y2="56" stroke="#188038" stroke-width="3.5"/><text x="1248" y="60">5V 輸出</text>
    <line x1="1330" y1="56" x2="1370" y2="56" stroke="#c2185b" stroke-width="2.5"/><text x="1378" y="60">EN 訊號</text>
    <text x="1455" y="60" fill="#666">粗 20AWG ．細 26AWG</text>
  </g>

  <rect x="24" y="120" width="690" height="600" rx="10" fill="#f7f9fc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="40" y="146" font-size="17" font-weight="700" fill="#334155">【電池盒】 Battery Pack</text>
  <text x="40" y="166" font-size="12" fill="#64748b">電芯 + BMS + 主保險絲 + 充電模組 → 拆下後仍受保護</text>

  <rect x="760" y="120" width="936" height="600" rx="10" fill="#f7fbf7" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="776" y="146" font-size="17" font-weight="700" fill="#334155">【通訊本體】 Radio Body</text>
  <text x="776" y="166" font-size="12" fill="#64748b">電流量測 + 開關 + 降壓 + Pi．I2C 全留在盒內，不穿過接頭</text>

  <!-- cells -->
  <g>
    <rect x="60" y="192" width="120" height="60" rx="5" fill="#fff" stroke="#475569" stroke-width="1.6"/>
    <text x="120" y="217" font-size="13.5" text-anchor="middle" fill="#111">電芯 4</text>
    <text x="120" y="236" font-size="11" text-anchor="middle" fill="#64748b">最高電位</text>
    <rect x="60" y="268" width="120" height="60" rx="5" fill="#fff" stroke="#475569" stroke-width="1.6"/>
    <text x="120" y="304" font-size="13.5" text-anchor="middle" fill="#111">電芯 3</text>
    <rect x="60" y="344" width="120" height="60" rx="5" fill="#fff" stroke="#475569" stroke-width="1.6"/>
    <text x="120" y="380" font-size="13.5" text-anchor="middle" fill="#111">電芯 2</text>
    <rect x="60" y="420" width="120" height="60" rx="5" fill="#fff" stroke="#475569" stroke-width="1.6"/>
    <text x="120" y="445" font-size="13.5" text-anchor="middle" fill="#111">電芯 1</text>
    <text x="120" y="464" font-size="11" text-anchor="middle" fill="#64748b">最低電位</text>
  </g>

  <g stroke="#d93025" stroke-width="3" fill="none">
    <path d="M180 200 L212 200"/>
    <path d="M180 244 L212 244 L212 276 L180 276"/>
    <path d="M180 320 L212 320 L212 352 L180 352"/>
    <path d="M180 396 L212 396 L212 428 L180 428"/>
    <path d="M180 472 L212 472"/>
  </g>
  <g fill="#d93025">
    <circle cx="212" cy="200" r="4.5"/><circle cx="212" cy="260" r="4.5"/>
    <circle cx="212" cy="336" r="4.5"/><circle cx="212" cy="412" r="4.5"/><circle cx="212" cy="472" r="4.5"/>
  </g>
  <line x1="212" y1="200" x2="300" y2="200" stroke="#d93025" stroke-width="3"/>
  <line x1="212" y1="260" x2="300" y2="260" stroke="#1a73e8" stroke-width="2"/>
  <line x1="212" y1="336" x2="300" y2="336" stroke="#1a73e8" stroke-width="2"/>
  <line x1="212" y1="412" x2="300" y2="412" stroke="#1a73e8" stroke-width="2"/>
  <line x1="212" y1="472" x2="300" y2="472" stroke="#333" stroke-width="3"/>
  <g font-size="11" fill="#1a73e8" text-anchor="middle">
    <text x="256" y="254">接點</text><text x="256" y="330">接點</text><text x="256" y="406">接點</text>
  </g>

  <rect x="300" y="170" width="185" height="332" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="392" y="222" font-size="15.5" font-weight="700" text-anchor="middle" fill="#1b5e20">BMS 4S 保護板</text>
  <text x="392" y="242" font-size="11.5" text-anchor="middle" fill="#33691e">YH11047A</text>
  <text x="392" y="482" font-size="11" text-anchor="middle" fill="#b71c1c">⚠ 確認是「均衡版」</text>
  <g font-size="13" font-weight="600" fill="#1b5e20">
    <text x="310" y="196">B+</text><text x="310" y="265">VH</text><text x="310" y="341">VM</text>
    <text x="310" y="417">VL</text><text x="310" y="477">B−</text>
    <text x="452" y="236">P+</text><text x="452" y="448">P−</text>
  </g>

  <line x1="485" y1="240" x2="530" y2="240" stroke="#d93025" stroke-width="3"/>
  <rect x="530" y="226" width="60" height="28" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="560" y="246" font-size="13" font-weight="700" text-anchor="middle" fill="#e65100">F1</text>
  <text x="560" y="216" font-size="11.5" text-anchor="middle" fill="#e65100" font-weight="600">3A 時滯型</text>
  <line x1="590" y1="240" x2="720" y2="240" stroke="#d93025" stroke-width="3"/>
  <circle cx="620" cy="240" r="4.5" fill="#d93025"/>
  <path d="M620 240 L620 505 L205 505 L205 546" stroke="#d93025" stroke-width="3" fill="none"/>

  <rect x="60" y="546" width="290" height="90" rx="7" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="205" y="576" font-size="14" font-weight="700" text-anchor="middle" fill="#8d6e00">UCHI 充電模組</text>
  <text x="205" y="596" font-size="11" text-anchor="middle" fill="#8d6e00">USB-C 5V → 16.8V</text>
  <text x="205" y="616" font-size="10.5" text-anchor="middle" fill="#a1887f">放盒內 = 備用電池可單獨充</text>
  <text x="248" y="540" font-size="11.5" font-weight="600" fill="#8d6e00">BAT+</text>
  <text x="248" y="654" font-size="11.5" font-weight="600" fill="#8d6e00">BAT−</text>
  <path d="M205 636 L205 690" stroke="#333" stroke-width="3" fill="none"/>

  <path d="M485 452 L485 496" stroke="#333" stroke-width="3.5" fill="none"/>
  <path d="M485 496 A 9 9 0 0 1 485 514" stroke="#333" stroke-width="3.5" fill="none"/>
  <path d="M485 514 L485 690" stroke="#333" stroke-width="3.5" fill="none"/>
  <path d="M205 690 L1550 690" stroke="#333" stroke-width="3.5" fill="none"/>
  <circle cx="485" cy="690" r="4.5" fill="#333"/>
  <text x="820" y="712" font-size="12.5" fill="#333">共同負極匯流 (BMS P− = GND)</text>

  <!-- connector -->
  <line x1="737" y1="130" x2="737" y2="712" stroke="#7c4dff" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="#7c4dff">
    <circle cx="727" cy="240" r="6"/><circle cx="747" cy="240" r="6"/>
    <circle cx="727" cy="690" r="6"/><circle cx="747" cy="690" r="6"/>
  </g>
  <text x="737" y="200" font-size="12.5" font-weight="700" text-anchor="middle" fill="#5e35b1">旋轉接頭</text>
  <text x="737" y="184" font-size="11" text-anchor="middle" fill="#5e35b1">只走電源 2 極</text>
  <text x="737" y="738" font-size="11" text-anchor="middle" fill="#5e35b1">觸點建議內凹</text>

  <!-- INA226 -->
  <line x1="747" y1="240" x2="800" y2="240" stroke="#d93025" stroke-width="3"/>
  <rect x="800" y="200" width="180" height="80" rx="7" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
  <text x="890" y="228" font-size="14.5" font-weight="700" text-anchor="middle" fill="#004d40">INA226</text>
  <text x="890" y="246" font-size="11" text-anchor="middle" fill="#00695c">高側電流 + 匯流排電壓</text>
  <text x="890" y="264" font-size="10.5" text-anchor="middle" fill="#00897b">量測 ＋ 低電量偵測 (#41)</text>
  <g font-size="11.5" font-weight="600" fill="#004d40">
    <text x="806" y="194">IN+</text><text x="946" y="194">OUT+</text>
  </g>
  <path d="M980 240 L1020 240 L1020 300 L1070 300" stroke="#d93025" stroke-width="3" fill="none"/>

  <!-- I2C bundle over the top -->
  <path d="M890 200 L890 186 L1560 186 L1560 250" stroke="#00897b" stroke-width="2.5" fill="none" stroke-dasharray="1 0"/>
  <text x="1225" y="180" font-size="12" text-anchor="middle" fill="#00695c" font-weight="600">I2C 4 線：SDA (腳3) / SCL (腳5) / 3V3 (腳1) / GND</text>

  <!-- buck -->
  <path d="M1036 690 L1036 410 L1070 410" stroke="#333" stroke-width="3" fill="none"/>
  <circle cx="1036" cy="690" r="4.5" fill="#333"/>
  <rect x="1070" y="282" width="205" height="150" rx="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="1172" y="326" font-size="15.5" font-weight="700" text-anchor="middle" fill="#0d47a1">Pololu 降壓</text>
  <text x="1172" y="348" font-size="12.5" text-anchor="middle" fill="#1565c0">輸出 5.1V</text>
  <text x="1172" y="368" font-size="10.5" text-anchor="middle" fill="#1976d2">補償線損（Pi 門檻 4.63V）</text>
  <g font-size="12.5" font-weight="600" fill="#0d47a1">
    <text x="1080" y="296">VIN+</text><text x="1080" y="426">VIN−</text>
    <text x="1220" y="296">5V</text><text x="1220" y="426">GND</text>
    <text x="1188" y="450">EN</text>
  </g>

  <!-- switch on EN -->
  <path d="M1172 432 L1172 510" stroke="#c2185b" stroke-width="2.5" fill="none"/>
  <rect x="1070" y="510" width="200" height="76" rx="7" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="1170" y="538" font-size="14.5" font-weight="700" text-anchor="middle" fill="#880e4f">Judco 開關</text>
  <text x="1170" y="557" font-size="11" text-anchor="middle" fill="#ad1457">push-push 鎖定型</text>
  <text x="1170" y="575" font-size="11" text-anchor="middle" fill="#ad1457">只走訊號，不走主電流</text>
  <path d="M1270 548 L1310 548 L1310 690" stroke="#333" stroke-width="2.5" fill="none"/>
  <circle cx="1310" cy="690" r="4.5" fill="#333"/>
  <text x="1330" y="620" font-size="11.5" fill="#c2185b">按下 = EN 接 GND = 關機</text>

  <!-- F2 -->
  <line x1="1275" y1="300" x2="1318" y2="300" stroke="#188038" stroke-width="3"/>
  <rect x="1318" y="286" width="60" height="28" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="1348" y="306" font-size="13" font-weight="700" text-anchor="middle" fill="#e65100">F2</text>
  <text x="1348" y="276" font-size="11.5" text-anchor="middle" fill="#e65100" font-weight="600">PPTC 2.5A</text>
  <line x1="1378" y1="300" x2="1440" y2="300" stroke="#188038" stroke-width="3"/>

  <!-- Pi -->
  <rect x="1440" y="250" width="215" height="170" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="1547" y="282" font-size="15.5" font-weight="700" text-anchor="middle" fill="#1b5e20">Raspberry Pi</text>
  <text x="1547" y="301" font-size="11.5" text-anchor="middle" fill="#33691e">Zero 2 W / Pi 4</text>
  <text x="1547" y="328" font-size="12.5" text-anchor="middle" fill="#1b5e20" font-weight="600">腳 2 或 4 = 5V 進</text>
  <text x="1547" y="348" font-size="12.5" text-anchor="middle" fill="#1b5e20" font-weight="600">腳 6 = GND</text>
  <text x="1547" y="370" font-size="12" text-anchor="middle" fill="#00695c" font-weight="600">腳 1 = 3V3 出 → INA226</text>
  <text x="1547" y="390" font-size="12" text-anchor="middle" fill="#00695c" font-weight="600">腳 3 / 5 = SDA / SCL</text>
  <text x="1547" y="410" font-size="11" text-anchor="middle" fill="#d93025">腳 1 只可取電，不可灌電</text>
  <path d="M1440 388 L1414 388 L1414 690" stroke="#333" stroke-width="3" fill="none"/>
  <circle cx="1414" cy="690" r="4.5" fill="#333"/>
  <text x="1547" y="442" font-size="11" text-anchor="middle" fill="#d93025">⚠ GPIO 供電繞過 Pi 內建保護，用防呆接頭</text>

  <!-- INA warning -->
  <rect x="800" y="310" width="200" height="96" rx="7" fill="#fff5f5" stroke="#d93025" stroke-width="1.8"/>
  <text x="900" y="332" font-size="12.5" font-weight="700" text-anchor="middle" fill="#b71c1c">⚠ INA226 供電必須 3.3V</text>
  <text x="812" y="352" font-size="11" fill="#b71c1c">模組的 I2C 上拉會拉到供電軌。</text>
  <text x="812" y="370" font-size="11" fill="#b71c1c">用 5V 供電 = 5V 出現在 Pi 的</text>
  <text x="812" y="388" font-size="11" fill="#b71c1c">I2C 腳（只耐 3.3V）→ 燒 Pi。</text>
  <text x="812" y="402" font-size="10.5" fill="#666">config.txt 需加 dtparam=i2c_arm=on</text>

  <!-- notes -->
  <rect x="24" y="758" width="530" height="162" rx="8" fill="#fff5f5" stroke="#d93025" stroke-width="2"/>
  <text x="42" y="784" font-size="14.5" font-weight="700" fill="#b71c1c">① 接 BMS 前必量：四點電壓遞增</text>
  <g font-size="13.5" fill="#333" font-family="monospace">
    <text x="46" y="810">B− → VL   ≈  3.7 V</text>
    <text x="46" y="832">B− → VM   ≈  7.4 V</text>
    <text x="46" y="854">B− → VH   ≈ 11.1 V</text>
    <text x="46" y="876">B− → B+   ≈ 14.8 V   （3S 則少 VH 一項）</text>
  </g>
  <text x="42" y="900" font-size="11.5" fill="#b71c1c">均衡抽頭接的是「兩顆電芯之間的接點」，不是單一端子。</text>
  <text x="42" y="916" font-size="11.5" fill="#b71c1c">接錯會燒 BMS，或造成單芯過充。</text>

  <rect x="578" y="758" width="530" height="162" rx="8" fill="#f1f8e9" stroke="#558b2f" stroke-width="2"/>
  <text x="596" y="784" font-size="14.5" font-weight="700" fill="#33691e">② 與原圖的四處差異</text>
  <g font-size="12.5" fill="#333">
    <text x="596" y="808">• 開關移出主電流路徑 → 改接 Pololu 的 EN 腳</text>
    <text x="612" y="825" font-size="11.5" fill="#666">Judco 額定 14V，滿電 16.8V 超規；EN 只走 µA</text>
    <text x="596" y="848">• F1 由 5A 降到 3A 時滯型（邊充邊用最大約 1.33A）</text>
    <text x="596" y="871">• F2 由 4A 降到 2.5A PPTC（Pi 4 峰值 1.5A）</text>
    <text x="596" y="894">• 新增 INA226 在電池側高壓段</text>
    <text x="612" y="911" font-size="11.5" fill="#666">量測續航 ＋ 低電量 graceful shutdown，一顆料兩用</text>
  </g>

  <rect x="1132" y="758" width="564" height="162" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/>
  <text x="1150" y="784" font-size="14.5" font-weight="700" fill="#8d6e00">③ 組裝前檢查</text>
  <g font-size="12.5" fill="#333">
    <text x="1150" y="808">□ 均衡點電壓遞增（見左）</text>
    <text x="1150" y="829">□ 確認 Pololu 的 EN 邏輯：拉低關閉 or 拉高啟用</text>
    <text x="1150" y="850">□ 裝 F1 後連續開關機 20 次，確認不誤跳</text>
    <text x="1150" y="871">□ 確認 BMS 是均衡版，不是純保護版</text>
    <text x="1150" y="892">□ INA226 供電接腳 1 (3V3)，絕不接 5V</text>
    <text x="1150" y="913">□ F1 用陶瓷高分斷或刀片式，禁用玻璃管</text>
  </g>
</svg>
