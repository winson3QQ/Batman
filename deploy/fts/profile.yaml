# Security profile for the FTS tenant — see docs/security-profiles.md (#153)
# Self-assessed posture, NOT certified (#93). Values drive #98/run.sh + #151 admission;
# assessment drives the compliance rollup. Nothing is `implemented` until the §5 drift-check passes.
tenant: fts
archetype: network-service
co_scheduled_with: [fts-ui]            # shared --network host; fts-ui reaches FTS over 127.0.0.1 (R7)

values:                                # machine-readable SoT — scripts/profile-to-flags.py derives docker flags from THIS.
                                       # `values` = what is actually applied; `assessment` = distance to target + why (staging is operational, not here).
  network:  {mode: host}               # ports 18087/8089/8443/19023, all >1024 (no NET_BIND)
  user:     {}                         # root NOW (Stage 0/2). Non-root is Stage 3 — then set run_as to a numeric uid (image has no 'fts' user; getpwuid risk Q2 + volume chown F7). Emits no --user until then.
  no_new_privileges: true
  caps:     {drop: [ALL], add: []}     # add:[] plausible (>1024 ports, python/sqlite/lxml/cert-gen) — TEST-GATED (R8)
  rootfs:   {read_only: false, tmpfs: ["/tmp:rw,nosuid,nodev,size=64m"]}   # read_only=false: VALIDATED on manet01 2026-09-15 — FTS mkdir's logs/ across site-packages (core/logs, core/cot_management/logs, components/extended/mission/logs, …) → EROFS. Exception, needs upstream FTS log-path fix or ~15 tmpfs. See assessment.rootfs.
  resources: {cpus: 1.0, pids: 512}     # reconciled (#81: idle ~0.2 core; 1.0=~5x headroom, leaves 3 cores for batman/OS; 512 pids vs ~90 idle). memory OMITTED — deferred until measured under load (B3/Stage 5)
  devices:  []
  seccomp:  {profile: default}
  privileged: false
  docker_socket_mounted: false
  secrets:                              # F5
    - {name: tak-mtls-key, delivery: file, exposure: "in apps/fts volume; protect at rest (#13/#47)"}

assessment:
  network:            {control: "NIST SP 800-190 §4.4.2", status: "planned:bridged-eval", evidence: "host-net today; see exceptions"}
  user:               {control: "CIS Docker 4.1 / PSS runAsNonRoot", status: "exception: FTS-blocked — VALIDATED on manet01 2026-09-15: --user 1000 (chowned volume) → PermissionError on .../FreeTAKServer/core/logs (logs written into root-owned site-packages). Same root cause as rootfs. Root retained; a swapped/fixed payload (logs→volume) can go non-root.", evidence: "PermissionError [Errno 13] on core/logs as uid 1000"}
  no_new_privileges:  {control: "CIS Docker 5.25 / PSS allowPrivilegeEscalation=false", status: "validated(manet01 2026-09-15); pending prod-apply + drift-check", evidence: "FTS starts with no-new-privileges (SecOpt=[no-new-privileges])"}
  caps:               {control: "CIS Docker 5.3 / PSS Restricted", status: "validated(manet01 2026-09-15): cap-drop=ALL add:[] — FTS runs, CoT Service Started; pending prod-apply", evidence: "CapDrop=[ALL], FTS functional"}
  rootfs:             {control: "CIS Docker 5.12", status: "exception: FTS-blocked — VALIDATED on manet01 2026-09-15: --read-only → EROFS on FreeTAKServer/**/logs (FTS mkdir's logs/ across its package dir). Needs upstream FTS log-root config or ~15 tmpfs. read_only=false; a payload that logs to a volume achieves this.", evidence: "OSError [Errno 30] Read-only file system on core/logs, core/cot_management/logs, components/extended/mission/logs"}
  resources:          {control: "CIS Docker 5.10/5.11/5.28 · NIST §4.4.2 (cpus=--cpus/CFS quota, not 5.11 cpu-shares)", status: "validated(manet01 2026-09-15): --cpus 1.0 + --pids 512 + --memory 512m all ENFORCE (memory.max=536870912 inside+out); memcg enabled via DTB byte-patch. --memory CAP VALUE still deferred:needs-load-measure (B3) — mechanism proven, prod cap TBD from load", evidence: "NanoCpus=1e9, PidsLimit=512, Memory=536870912 enforced on manet01"}
  seccomp:            {control: "CIS Docker 5.21", status: implemented, evidence: "SecurityOpt has no seccomp=unconfined; default profile applied — pending §5 assert to keep honest (R6)"}
  privileged:         {control: "CIS Docker 5.4 / PSS Baseline", status: implemented, evidence: "Privileged=false (docker inspect) — pending §5 assert"}
  docker_socket:      {control: "CIS Docker 5.31", status: implemented, evidence: "socket not mounted — pending §5 assert"}
  secrets:            {control: "NIST SP 800-190 §4.3.4", status: planned, evidence: "mTLS key on volume; at-rest protection gated on #47/#13"}

exceptions:
  - axis: network
    reason: "--network host for mesh port binding on the node's mesh address"
    compensating_control: "host nftables restricting the mesh-facing FTS ports to the mesh/onboarding nets"
    status: planned            # the firewall rule set does not exist yet — do not claim implemented (R3)

target: {level: PSS-Restricted, note: "rollup = N/M axes implemented-with-evidence; host-net fails Baseline on that axis (F9)"}
