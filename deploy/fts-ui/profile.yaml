# Security profile for the fts-ui tenant — see docs/security-profiles.md (#153)
# Self-assessed posture, NOT certified (#93).
tenant: fts-ui
archetype: network-service
co_scheduled_with: [fts]               # reaches FTS API at 127.0.0.1:19023 over the shared host netns (R7):
                                        # a bridged-network move must treat fts+fts-ui as one unit or the UI->API path breaks

values:                                # SoT — flags derived from THIS; `values` = what is actually applied now.
  network:  {mode: host}               # UI :5000, >1024
  user:     {}                         # root NOW (Stage 0/2). Non-root is Stage 3 (numeric uid + volume chown, F7). Emits no --user until then.
  no_new_privileges: true
  caps:     {drop: [ALL], add: []}
  rootfs:   {read_only: false, tmpfs: ["/tmp:rw,nosuid,nodev,size=64m"]}   # read_only DEFERRED to its own iteration (Stage 4): cwd is
                                        # /usr/local/.../FreeTAKServer-UI inside rootfs; Flask writes instance/session/temp relative to cwd.
                                        # Flip to true only after enumerating + tmpfs/redirecting those paths (M2/Q4). Kept false so values==applied.
  resources: {cpus: 0.5, pids: 128}     # reconciled (#81: near-idle Flask). memory OMITTED — deferred (B3/Stage 5)
  devices:  []
  seccomp:  {profile: default}
  privileged: false
  docker_socket_mounted: false
  secrets:                              # F5 — do NOT under-rate: a full FTS API token is admin-equivalent to FTS
    - {name: fts-api-token, delivery: env, exposure: "passed as -e FTS_API_KEY=Bearer …; visible in /proc/<pid>/environ and docker inspect — prefer file/secret-store over env"}

assessment:
  network:            {control: "NIST SP 800-190 §4.4.2", status: "planned:bridged-eval", evidence: "host-net today"}
  user:               {control: "CIS Docker 4.1 / PSS runAsNonRoot", status: planned, evidence: "root today; #98 + volume chown"}
  no_new_privileges:  {control: "CIS Docker 5.25 / PSS", status: planned, evidence: "SecurityOpt empty today"}
  caps:               {control: "CIS Docker 5.3 / PSS Restricted", status: planned, evidence: "default caps today; add:[] test-gated"}
  rootfs:             {control: "CIS Docker 5.12", status: "deferred: read_only OFF (values.read_only=false) until cwd write-paths enumerated — own iteration Stage 4 (M2/Q4)", evidence: "ReadonlyRootfs=false today AND intended"}
  resources:          {control: "CIS Docker 5.10/5.11/5.28 · NIST §4.4.2", status: "planned: --cpus/--pids Stage 2; --memory blocked:needs-load-measure (Stage 5)", evidence: "no limits today"}
  seccomp:            {control: "CIS Docker 5.21", status: implemented, evidence: "default profile — pending §5 assert (R6)"}
  privileged:         {control: "CIS Docker 5.4 / PSS Baseline", status: implemented, evidence: "Privileged=false — pending §5 assert"}
  docker_socket:      {control: "CIS Docker 5.31", status: implemented, evidence: "socket not mounted — pending §5 assert"}
  secrets:            {control: "NIST SP 800-190 §4.3.4", status: planned, evidence: "token via env — move off env; admin-equivalent, high value (F5)"}

exceptions:
  - axis: network
    reason: "--network host; and the UI->API loopback path depends on sharing FTS's netns (R7)"
    compensating_control: "host nftables restricting :5000 to the operator/onboarding net; keep fts+fts-ui co-scheduled"
    status: planned

target: {level: PSS-Restricted, note: "web attack surface (:5000) makes read-only + non-root high-value; rollup = N/M axes"}
