# Batman OTS rabbitmq config — mounted read-only into /etc/rabbitmq/conf.d/.
# OTS declares transient (non-exclusive) queues; RabbitMQ 4.x denies this deprecated feature by
# default and the broker EXITS on boot ({failed_to_deny_deprecated_features,[transient_nonexcl_queues]}),
# which cascades to the API (AMQPConnectionError). Permit it so a freshly-recreated broker comes up.
# (Was an ephemeral conf.d flag on the running container before — lost on recreate. #170 deploy gap.)
# Longer-term: pin rabbitmq:3.13 (OTS's native version) which still allows this; needs the image on-node.
deprecated_features.permit.transient_nonexcl_queues = true

# Memory backpressure sized to the 512m cgroup (#171). RabbitMQ's default watermark is
# 0.6 of AVAILABLE memory and is host-blind: on this node it computes to ~4.89 GB (0.6 x 8 GB),
# far above the container's 512 MiB memory.max -> the cgroup OOM-kills the broker long before it
# self-throttles. An absolute value makes it block publishers (backpressure, NOT message drop)
# before the cgroup limit. The alarm fires on rss; the cgroup counts memory.current = rss + page
# cache + socket buffers, so 300 MB leaves ~44% headroom for what the alarm doesn't see.
# Validated on-node: setting 100MB (< live rss) fired the alarm and BLOCKED publishers (CoT stopped
# landing) with memory.current 120MB << 512MB; 300MB cleared the alarm and CoT flowed.
# CAVEAT: the rss-vs-memory.current gap under a sustained large backlog is NOT validated (would need
# ~150k queued msgs); mitigated because 4.3.6 classic queues are CQv2 and page to disk by default, so
# a no-consumer backlog does not pile into RAM 1:1. No paging-ratio config needed (CQv2 is intrinsic).
vm_memory_high_watermark.absolute = 300MB
