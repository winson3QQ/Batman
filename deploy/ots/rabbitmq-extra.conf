# Batman OTS rabbitmq config — mounted read-only into /etc/rabbitmq/conf.d/.
# OTS declares transient (non-exclusive) queues; RabbitMQ 4.x denies this deprecated feature by
# default and the broker EXITS on boot ({failed_to_deny_deprecated_features,[transient_nonexcl_queues]}),
# which cascades to the API (AMQPConnectionError). Permit it so a freshly-recreated broker comes up.
# (Was an ephemeral conf.d flag on the running container before — lost on recreate. #170 deploy gap.)
# Longer-term: pin rabbitmq:3.13 (OTS's native version) which still allows this; needs the image on-node.
deprecated_features.permit.transient_nonexcl_queues = true
