# Payload descriptor for the OpenTAKServer (OTS) tenant — app #1 of the payload framework.
# See docs/design/payload-framework.md (#68) + docs/security-profiles.md (#153).
# `values` is the machine-readable SoT — scripts/profile-to-flags.py derives docker flags
# from THIS block ONLY. The operational siblings (images/network/lifecycle/volumes) are
# read by the payload manager (ordering-wrapper + fw4 generator), IGNORED by the emitter.
# Self-assessed, NOT certified (#93). Nothing is `implemented` until the §5 drift-check passes.
apiVersion: batman.payload/v1
tenant: opentakserver
archetype: network-service
co_scheduled_with: [ots-db, rabbitmq, ots-cot-parser, ots-eud-gateway]
# operational (emitter-ignored; -> manifest MEMTOTAL_MIN_MB, honoured by payload-run): #264 - OTS runs only on a Pi 4
# with 8 GB (the user, 2026-10-12). Its memory caps are 2 x 1280m + 1024m (ots_eud_gateway, #289 M12) + 2 x 512m = 4.6 GiB;
# on a smaller node all caps hit at once would OOM the node, not the tenant. A Pi 4 8 GB reports MemTotal ~7.6 GiB, a 4 GB
# one ~3.7 GiB: payload-run refuses to start or rebuild the stack below 7000 MB (and when MemTotal is unreadable - fail-closed).
requires: {mem_total_min_mb: 7000}

values:                                # emitter reads ONLY this
  network:  {mode: bridged}            # br-ots; EUD 8088/8089 + web 8443, all >1024. VALIDATED (design B) on manet01.
  user:     {run_as: 1000, run_as_gid: 1024}   # OTS non-root BY DESIGN: image `USER ots` = uid 1000, gid 1024 (adduser auto-assigned 1000; gid pinned 1024). Must pass BOTH — /app is 0700 owned by 1000, so --user 1024 (wrong owner) EPERM. Verified on manet01.
  no_new_privileges: true
  caps:     {drop: [ALL], add: []}     # plausible (>1024 ports, python stack) — TEST-GATED (gate item 2, not yet applied to OTS containers)
  rootfs:   {read_only: true, tmpfs: ["/tmp:rw,nosuid,nodev,size=64m"]}   # read_only ON (#98, manet01 2026-09-18): docker diff = only /tmp/dp.zip (opentakserver) beyond the /app/ots volume; logs go to the /app/ots volume, .pyc write is EROFS-tolerated. Validated: recreate 4 app containers --read-only + tmpfs /tmp → all up + CoT round-trip OK.
  resources: {cpus: 1.0, memory: 1280m, pids: 512}   # idle measured ~116MiB/service on Pi4 (2026-09-16). #264: 1280m (a cap, not a reservation) for opentakserver + ots_cot_parser. OTS runs only on Pi 4 8 GB (the user, 2026-10-12; 04: ~6.6 GiB available); 2 x 1280m + 1024m (ots_eud_gateway: its own block under infra_values, #289) + 2 x 512m = 4.6 GiB < available, so all caps hit at once still do not OOM the node; memcg enabled (docker-in-image #159).
  devices:  []
  seccomp:  {profile: default}
  privileged: false
  docker_socket_mounted: false
  secrets:                             # F5 — delivery mechanism owned by #167
    - {name: eud-ssl-cert, delivery: file, exposure: "TLS server cert/key + CA/CRL for the EUD gateway's 8089 listener (ots-appdata volume, /app/ots/ca); protect at rest (#13/#47)"}

infra_values:                          # NEW (#98): per-container confinement for the co-scheduled infra
                                       # (db, broker). Same emitter (profile-to-flags.py) writes one
                                       # <container>.hardening.env each; run.sh applies them. Keeps the
                                       # single-`values` apps backward-compatible (this block is optional).
  ots-db:                              # imresamu/postgis — postgres uid 999; PGDATA on a volume
    user:     {run_as: 999, run_as_gid: 999}   # run non-root directly; volume pre-chowned 999 (no root/gosu → no SETUID/SETGID caps needed)
    no_new_privileges: true
    caps:     {drop: [ALL], add: []}   # non-root postgres binds 5432 (>1024) → no caps
    rootfs:   {read_only: true, tmpfs: ["/tmp:rw,nosuid,nodev,size=64m", "/run/postgresql:rw,nosuid,nodev,size=16m"]}   # read_only ON (#98, manet01 2026-09-18): `docker diff ots-db` empty — postgres writes only to the PGDATA volume + /run/postgresql (socket, tmpfs) + /tmp (tmpfs); logs to stderr, temp files to PGDATA. Validated: recreate --read-only → pg_isready + CoT round-trip OK.
    resources: {cpus: 1.0, memory: 512m, pids: 512}   # provisional; revise after load (#171)
    seccomp:  {profile: default}
  rabbitmq:                            # rabbitmq:latest — uid 999, HOME + mnesia on the volume
    user:     {run_as: rabbitmq}       # BY NAME (not 999:999): docker resolves the passwd entry → sets HOME=/var/lib/rabbitmq so the erlang cookie path works. Numeric uid has no HOME → cookie read/write fails → rabbitmq exits(1). (manet01 2026-09-17)
    no_new_privileges: true
    caps:     {drop: [ALL], add: []}   # non-root broker binds 5672/15672/25672 (>1024) → no caps
    rootfs:   {read_only: true, tmpfs: ["/tmp:rw,nosuid,nodev,size=64m"]}   # read_only ON (#98, manet01 2026-09-18): docker diff = ONLY /etc/rabbitmq/enabled_plugins (cookie + mnesia are on the /var/lib/rabbitmq volume). Fixed by RABBITMQ_ENABLED_PLUGINS_FILE=/var/lib/rabbitmq/enabled_plugins (run.sh) → the boot write lands on the volume. Validated: recreate --read-only → rabbitmq up + CoT round-trip OK.
    resources: {cpus: 1.0, memory: 512m, pids: 512}   # provisional; revise after load (#171)
    seccomp:  {profile: default}
  ots_eud_gateway:                     # #289: ONE asyncio process serves both CoT ports (8088 allowlist, default off;
                                       # 8089 mTLS) in front of cot_parser, replacing ots_eud_handler + ots_eud_handler_ssl
                                       # and the #264 overlay. Memory 1024m is provisional (design M12: ~780 MiB worst case
                                       # before the per-session Python cost, measured in rc 1 by eud-mem-289 and revised);
                                       # pids 32 (one loop + 4 DB threads + watchdog + the health exec). Same confinement
                                       # as `values` otherwise; the container spec below carries env_common: true.
    user:     {run_as: 1000, run_as_gid: 1024}
    no_new_privileges: true
    caps:     {drop: [ALL], add: []}
    rootfs:   {read_only: true, tmpfs: ["/tmp:rw,nosuid,nodev,size=64m"]}
    resources: {cpus: 1.0, memory: 1024m, pids: 32}
    seccomp:  {profile: default}

assessment:
  network:            {control: "NIST SP 800-190 §4.4.2 / CIS Docker 5.29", status: "validated(manet01 2026-09-16): bridged (br-ots) + fw4-native DNAT publish + dockert zone input=DROP — 5/5 gate incl blast-radius + cold-reboot; see docs/design/ots-networking.md", evidence: "container->openmanetd/dropbear BLOCKED; DNAT 8088/8089 reachable; single inet fw4 table"}
  user:               {control: "CIS Docker 4.1 / PSS runAsNonRoot", status: "validated(manet01 2026-09-16): --user 1000:1024 pinned = image's ots (uid 1000, gid 1024); API + workers run non-root. NOTE /app is 0700 owned by 1000 so BOTH uid+gid must match.", evidence: "id=uid=1000(ots) gid=1024(ots); API Up under --user 1000:1024"}
  no_new_privileges:  {control: "CIS Docker 5.25 / PSS", status: "validated(manet01 2026-09-17): applied to ALL 6 containers (app+db+broker); verify-profile PASS", evidence: "docker inspect SecurityOpt=[no-new-privileges] on all 6"}
  caps:               {control: "CIS Docker 5.3 / PSS Restricted", status: "validated(manet01 2026-09-17): --cap-drop=ALL add:[] on ALL 6 (non-root, all ports >1024 so no add-back needed); SSL CoT still works", evidence: "docker inspect CapDrop=[ALL] on all 6; batmantest client ID'ed + held 15s + cot stored"}
  rootfs:             {control: "CIS Docker 5.12", status: "VALIDATED(manet01 2026-09-18): --read-only on ALL 6 containers. Incremental rollout postgres->python->rabbitmq, each functional-tested. app: --tmpfs /tmp (/tmp/dp.zip); .pyc EROFS-tolerated; logs+state on the /app/ots volume. rabbitmq: RABBITMQ_ENABLED_PLUGINS_FILE=/var/lib/rabbitmq/enabled_plugins moves the only rootfs write to the volume. postgres: writes only PGDATA-volume + /run/postgresql. Full run.sh redeploy -> all 6 ReadonlyRootfs=true, full-chain CoT round-trip OK.", evidence: "docker inspect ReadonlyRootfs=true on all 6; touch /nope -> Read-only file system; FIN-1 CoT stored end-to-end (eud->rabbitmq->cot_parser->postgres, all RO)"}
  resources:          {control: "CIS Docker 5.10/5.11/5.28 · NIST §4.4.2", status: "validated(manet01 2026-09-17): --cpus 1.0 / --memory 512m / --pids 512 ENFORCED on ALL 6 (NanoCpus/Memory/PidsLimit set). Provisional; revise after load (#171).", evidence: "docker inspect + verify-profile PASS on all 6"}
  seccomp:            {control: "CIS Docker 5.21", status: "validated(manet01 2026-09-17): default profile (never unconfined) on all 6", evidence: "verify-profile 'seccomp not unconfined' PASS"}
  privileged:         {control: "CIS Docker 5.4 / PSS Baseline", status: "validated(manet01 2026-09-17): privileged=false on all 6", evidence: "verify-profile 'not privileged' PASS"}
  docker_socket:      {control: "CIS Docker 5.31", status: "validated(manet01 2026-09-17): socket not mounted on all 6", evidence: "verify-profile 'socket not mounted' PASS"}
  secrets:            {control: "NIST SP 800-190 §4.3.4", status: "planned: eud-ssl-cert delivery unowned until #167 (SSL cert now present in /app/ots/ca volume from cert-gen — see #170)", evidence: ""}

exceptions: []   # rootfs.read_only resolved 2026-09-18 (all 6 containers --read-only, validated). No standing exceptions.

target: {level: PSS-Restricted, note: "rollup: 9/9 confinement axes validated on all 6 containers (rootfs.read_only completed 2026-09-18 — all 6 --read-only). AppArmor + device-cgroup are v2.0-gated on #109 (kernel). bridged network (not host) means this genuinely reaches Restricted, unlike the retired FTS host-net exception."}

# ---- operational siblings (payload-manager consumed; emitter-ignored) ----
# #167 Increment 3: fully specifies what deploy/ots/run.sh hardcoded, so `payload-run opentakserver`
# reproduces the SAME 6-container stack. env_common = run.sh's $CM (the 4 app containers only).
env_common:
  SQLALCHEMY_DATABASE_URI: "postgresql+psycopg://ots:password@ots-db/ots"   # internal-only cred (ots-db unpublished); per-node-random + at-rest → #47 (review m2)
  OTS_RABBITMQ_SERVER_ADDRESS: rabbitmq
  OTS_LISTENER_ADDRESS: 0.0.0.0
  OTS_FQDN: _
  OTS_MEDIAMTX_API_ADDRESS: "http://localhost:9997"

images:
  - ref: "batman/ots:1.7.13-arm64"                    # digest-pin before prod
    containers:
      # chown-once: only opentakserver (first app container) chowns the shared ots-appdata volume;
      # the other three just mount it. run.sh chowns it once upfront via the OTS image as vehicle.
      - {name: opentakserver, ip: 172.20.0.5, hostname: opentakserver,
         volumes: [{name: ots-appdata, path: /app/ots, chown: "1000:1024"}]}
      - {name: ots_cot_parser, ip: 172.20.0.4, hostname: ots-cot_parser,
         entrypoint: [python3, /app/venv/bin/cot_parser],   # ip: was MISSING -> on boot docker auto-assigned
         volumes: [{name: ots-appdata, path: /app/ots}]}     # the lowest-free 172.20.0.2 = ots-db's static IP,
                                                             # so ots-db failed "address already in use" and got
                                                             # stuck Created (intermittent OTS reboot flakiness).
                                                             # Explicit static IP makes bring-up order-independent.
      # #289: the EUD gateway (deploy/ots/gateway/, built into ONE regular file eud-gateway.pyz by build-pyz.sh:
      # payload-run's MOUNT rule takes plain files only). It runs on the image's own Python/pika/SQLAlchemy and
      # overlays NO upstream file (no MOUNTSHA); it reads /app/ots/config.yml for the DB/broker settings like
      # cot_parser does. Listed AFTER opentakserver: the start gates run in manifest order and the gateway waits for
      # the schema + TLS files that opentakserver's first run creates (design §1). Confined by its OWN infra_values
      # block (1024m, pids 32); env_common: true keeps the app env on it.
      - {name: ots_eud_gateway, ip: 172.20.0.10, hostname: ots_eud_gateway, env_common: true,
         entrypoint: [python3, /app/eud-gateway.pyz],
         env: {GATEWAY_OTS_VERSION: "1.7.13", MALLOC_MMAP_THRESHOLD_: "131072"},   # design §4 OTA stage 2: the gateway exits 2 on another OTS version (validated against this one; bump with the image ref above); MALLOC_MMAP_THRESHOLD_ 128 KiB: the 256 KiB TLS buffers come from mmap and go back to the OS when freed (glibc kept a flood's peak, 129 -> 53 MiB in the flip)
         volumes: [{name: ots-appdata, path: /app/ots}],
         mounts: [{src: eud-gateway.pyz, dst: /app/eud-gateway.pyz, ro: true}]}
  - ref: "imresamu/postgis:18-3.6"
    containers:
      - {name: ots-db, ip: 172.20.0.2, hostname: ots-db,
         env: {POSTGRES_USER: ots, POSTGRES_PASSWORD: password, POSTGRES_DB: ots, PGUSER: ots},
         volumes: [{name: ots-pgdata, path: /var/lib/postgresql, chown: "999:999", chown_image: "batman/ots:1.7.13-arm64"}]}
  - ref: "rabbitmq:4.3.6"                              # PINNED (validated running version), not :latest
    containers:
      - {name: rabbitmq, ip: 172.20.0.3, hostname: rabbitmq,
         env: {RABBITMQ_ERLANG_COOKIE: batman-ots-cookie, RABBITMQ_ENABLED_PLUGINS_FILE: /var/lib/rabbitmq/enabled_plugins},
         mounts: [{src: rabbitmq-extra.conf, dst: /etc/rabbitmq/conf.d/99-batman.conf, ro: true},   # tenant-relative src (shipped in apps/opentakserver/)
                  {src: rabbitmq-definitions.json, dst: /etc/rabbitmq/batman-definitions.json, ro: true}],   # #264 r3: per-EUD queue policy (see rabbitmq-extra.conf)
         volumes: [{name: ots-mqdata, path: /var/lib/rabbitmq, chown: "999:999", chown_image: "batman/ots:1.7.13-arm64"}]}

network:                               # -> fw4-native uci-default (validated design B)
  docker_name: ots-net                 # REUSE the existing network name (run.sh's) so migration reuses the live br-ots network, no re-create
  bridge: {name: br-ots, subnet: 172.20.0.0/24}
  zone:   dockert
  publish:                             # each target is a DISTINCT container's static IP on br-ots
    - {src_zone: ahwlan, host_port: 8088, to: "172.20.0.10:8088", proto: tcp}   # EUD gateway (plain CoT: allowlisted relays only; the listener is off when the allowlist is empty, #289 P4)
    - {src_zone: ahwlan, host_port: 8089, to: "172.20.0.10:8089", proto: tcp}   # EUD gateway (mTLS CoT, the members)
    - {src_zone: ahwlan, host_port: 8443, to: "172.20.0.11:443",  proto: tcp}   # nginx web UI (optional; not in Milestone A core)
  isolation: {input: DROP, forward: intra-zone, egress: none}   # blast-radius: container->host BLOCKED
  peer_allow: []

lifecycle:
  order:  [ots-db, rabbitmq, opentakserver, ots_cot_parser, ots_eud_gateway]
  health:
    ots-db:        "pg_isready -q"
    rabbitmq:      "rabbitmq-diagnostics -q ping"
    opentakserver: "curl -fsS http://localhost:8081/api/health"
    # #289 M17: 200 only when both configured listeners are bound and the AMQP connection is open. A start gate
    # only (the guardian never polls it); on a first boot the gateway waits for opentakserver's schema/certs and
    # the gate may TIMEOUT (WARN, continue) — the gateway comes up on its own (design §4).
    ots_eud_gateway: "curl -fsS http://localhost:8090/healthz"
  # #274 graceful stop order (lower tier first; a container not listed is in the FINAL tier = the stateful
  # services, which get the longest grace). #289 M13: the gateway stops FIRST (tier 1: <= 4.5 s inside docker
  # stop -t 5 — presence rows, the t-x-d-d events, cache flush with confirms, a poll of the cot_parser queue until
  # drained); cot_parser is in tier 2 so it is still consuming while the gateway flushes; opentakserver with it.
  # Two client tiers <= 10 s inside K08's 15 s.
  stop_tier:
    ots_eud_gateway: 1
    ots_cot_parser: 2
    opentakserver: 2
  init_once:                           # first-boot only; app self-inits schema/CA
    - "opentakserver first-run creates CA + DB schema (no manual step needed)"
  restart: "no"                        # #274 §12 D7-1: the guardian is the only starter/restarter (ordered,
                                       # health-gated start on every boot incl. OTA and power loss; crash
                                       # restarts with backoff and a ledger autocommit trusts). History: #206
                                       # chose unless-stopped because on-failure:5 gave up in the reflash
                                       # dependency race; the gated start removed that race, and
                                       # unless-stopped made dockerd a second owner (#274 E6/E15).
