[package]
name = "batman-proto"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Batman provisioning protocol core for the app (sans-IO; docs/design/254-app-s1.md, 219-protocol.md §10)"

[lib]
path = "src/lib.rs"

[features]
# test vectors need a fixed Noise ephemeral key; never enabled in a release build (the app's Cargo.toml must not
# turn it on). Enabled for `cargo test` through the self dev-dependency below, so the vector tests can never be skipped.
test-vectors = []
# design §4.1 / §6: the trust policy is a constant of the BUILD, never a runtime value. With `dev-trust` (the app's dev
# flavor only) a self-signed `dev:` DAC is accepted on first contact (TOFU); without it (field flavor) it is refused.
# Never a default; the field release must not enable it (checked with `cargo tree -e features,no-dev`).
dev-trust = []

[dependencies]
# versions pinned exactly, each >= 2 weeks old at selection (2026-11-07), MIT OR Apache-2.0
hkdf = "=0.13.0"
sha2 = "=0.11.1"
# snow: RUSTSEC-2024-0011 (unauthenticated nonce increment) is patched in >= 0.9.5
#       only the primitives Noise_NX(psk0)_25519_ChaChaPoly_SHA256 needs (no AES-GCM / BLAKE2)
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "ecdh", "std"] }
# 0.10.1 = the version snow already depends on (one copy in the build)
chacha20poly1305 = "=0.10.1"
getrandom = "=0.4.3"
x509-cert = { version = "=0.3.0", default-features = false, features = ["std"] }
der = { version = "=0.8.2", features = ["std"] }
snow = { version = "=0.10.0", default-features = false, features = ["std", "use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }

[dev-dependencies]
batman-proto = { path = ".", features = ["test-vectors"] }
serde_json = "=1.0.140"
hex = "=0.4.3"
sha2 = "=0.11.1"
# tests only: sign a dev-DAC node_cert fixture (RFC 6979 deterministic signing is p256's default); the node side of
# the ECDH-ES / ChaCha20-Poly1305 round trip
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "ecdh", "std"] }
chacha20poly1305 = "=0.10.1"
