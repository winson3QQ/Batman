# #280 D5 — defence in depth for world-writable /tmp (docs/design/280-tmp-trust.md). The real fix is the
# root-only run dir; these make the kernel refuse the classic /tmp tricks even for code we have not audited.
# symlinks/hardlinks: OpenWrt's 10-default.conf sets them too — pinned here so a base change cannot drop them
# (the operator-flag checks rely on protected_hardlinks as a second layer).
fs.protected_symlinks=1
fs.protected_hardlinks=1
# regular/fifos=2: an O_CREAT open of a file/FIFO owned by someone else in a sticky world-writable dir fails,
# even for root — root can no longer be made to write INTO a file a non-root process pre-created.
fs.protected_regular=2
fs.protected_fifos=2
