# Pi 500 (BCM2712 + RP1) HaLow S1G 802.11s mesh — /etc/halow/mesh-wlan1.conf
# 參數對齊 manet01 / manet02（OpenMANET 1.8.0，uci wireless.radio1 / default_radio1）
# 由 systemd halow-mesh.service 餵給 wpa_supplicant_s1g（Morse 的 hostap fork）
#
# ⚠️ 不要用 frequency= 指定頻道。Morse 的 wpa_supplicant fork 是從 S1G 的
#    channel + op_class 自己算出 5GHz-mapped frequency 的（wpa_supplicant.c:3164 起）。
#    給 frequency 會被它算成別的頻道。

ctrl_interface=/run/wpa_supplicant_s1g
country=US

# ⚠️ mesh_fwding 必須放在【全域】，不能放 network 區塊裡：
# wpa_supplicant.c 在進 mesh 模式時會用全域值覆蓋 network 層的設定
#     if (ssid->mode == WPAS_MODE_MESH) ssid->mesh_fwding = wpa_s->conf->mesh_fwding;
# 放在 network={} 內會被默默丟掉，iw get mesh_param 會顯示 1。
# 0 = 802.11s 不做轉發，交給 batman-adv（對齊 manet01，見 docs/cloning-a-node.md）
mesh_fwding=0

network={
	ssid="openmanet1"
	mode=5
	channel=40
	op_class=70
	s1g_prim_1mhz_chan_index=1
	key_mgmt=SAE
	psk="12345678"
	ieee80211w=2
	beacon_int=1000
	dtim_period=1
}

# ── 三個不能少的欄位 ──────────────────────────────────────────────────────
#
# s1g_prim_1mhz_chan_index=1
#   4 MHz 才是 1（2 MHz 是 0）。節點從 channel=40 自己推出 1，兩端不一致會
#   SAE-AUTH-FAILURE / plink 卡在 LISTEN。見 docs/upgrade-1.8.0.md。
#
# ieee80211w=2   ← issue #33 的修復，2026-09-09 加入
#   PMF required。BlockAck（category 3）在 802.11 裡屬於 robust management frame，
#   沒開 PMF 時 mac80211 的 ieee80211_tx_h_select_key() 會把 ADDBA/DELBA 明文送出
#   （ieee80211_use_mfp() 第一個條件就是 test_sta_flag(sta, WLAN_STA_MFP)），
#   對端（OpenWrt encryption='sae' 預設 ieee80211w=2）在
#   ieee80211_drop_unencrypted_mgmt() 靜默丟棄 → BA session 永遠建不起來 →
#   完全沒有 A-MPDU 聚合 → 吞吐卡在 ~3.4 Mbps 且 MCS 亂跳。
#   加上之後：下行 3.45 → 10.28 Mbps、MCS7 佔 96%、tx failed 歸零。
#   MPM peering frame 是 category 15（SELF_PROTECTED，非 robust），所以少了這行
#   mesh 照樣配對成功、data 照樣通 —— 症狀只有「什麼都好，就是慢」，很難察覺。
#   詳見 docs/field-test-log.md。
#
# mesh_fwding=0（全域）
#   必須與節點的 mesh11sd.mesh_params.mesh_fwding 一致。另外
#   mesh_nolearn 兩端也必須都是 1，否則單播全丟（batctl ping 100% loss）。
