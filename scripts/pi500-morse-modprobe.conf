# Wio-WM6108 (FGH100M-H / MM6108A1) on Seeed WM1302 Pi HAT
#
# enable_ext_xtal_init : 模組使用外部 32kHz 晶振，CMD63 前必須啟用其延遲序列
# bcf                  : 板型未燒入 OTP，驅動無法自動推導，必須指定完整檔名
#
# 以下對齊 manet01/manet02（見 Batman/scripts/setup-node2.sh）：
# country / enable_ps / enable_twt / enable_mcast_rate_control 必須與節點相同
options morse enable_ext_xtal_init=1 bcf=bcf_fgh100mhaamd.bin \
        country=US enable_ps=0 enable_twt=0 enable_mcast_rate_control=1
